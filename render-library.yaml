# Employee-library backend. Use this Blueprint instead of the legacy static-site
# Blueprint when a persistent PostgreSQL DATABASE_URL is available.
services:
  - type: web
    name: toyota-employee-library
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/nandan-neualto/toyota-reader
    branch: main
    buildCommand: npm ci --include=dev && npm run build:render
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: LIBRARY_ADMIN_ID
        sync: false
      - key: LIBRARY_ADMIN_PIN
        sync: false
      - key: LIBRARY_ADMIN_NAME
        value: Toyota Library Administrator
      - key: LIBRARY_MAX_BYTES
        value: "268435456"
