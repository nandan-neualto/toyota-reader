services:
  - type: web
    name: toyota-reader
    runtime: static
    repo: https://github.com/nandan-neualto/toyota-reader
    branch: main
    buildCommand: npm ci --include=dev && npm run build:render
    staticPublishPath: .next-render
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /offline-assets.json
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
